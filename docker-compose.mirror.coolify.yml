# ===========================================================================
# MIROIR AUTONOME — variante COOLIFY.
#
# Même image et même configuration nginx que `docker-compose.mirror.yml` ; seule
# la façon d'être joint change. Deux fichiers et non un seul, parce que les deux
# cibles s'excluent : ici le réseau `coolify` est déclaré `external: true`, ce qui
# fait échouer `docker compose up` sur une machine qui ne l'a pas — or l'intranet
# d'école, cible d'origine du miroir, ne l'a pas.
#
#   Coolify (ce fichier)     : Traefik route le domaine, rien n'est publié.
#   Intranet, machine nue    : docker-compose.mirror.yml, port publié en direct.
#
# POURQUOI CE FICHIER EXISTE : déployé avec le compose autonome, le miroir
# répondait 504 Gateway Timeout. Traefik routait bien le domaine, mais ne pouvait
# pas joindre le conteneur — celui-ci n'était que sur un bridge interne au projet.
# C'est la panne que le commentaire de `docker-compose.prod.yml` décrit déjà.
# ===========================================================================

services:
  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
      args:
        # Le domaine de CE miroir. Il est construit dans le frontend et repart
        # dans le `?origin=` de la connexion 42 : l'instance principale ne
        # renverra les visiteurs ici que s'il figure dans ses origines autorisées.
        # SCHÉMA OBLIGATOIRE (`https://…`) : sans lui, la principale ne sait pas
        # lire la valeur comme une origine, et l'entrypoint refuse de démarrer.
        APP_DOMAIN: ${APP_DOMAIN:?domaine public de ce miroir requis, schéma compris}
    environment:
      # TLS terminé par Traefik : nginx sert en clair sur son port interne.
      ENABLE_SSL: "false"
      APP_DOMAIN: ${APP_DOMAIN}
      # API de l'instance principale, chemin /api compris. Sa présence suffit à
      # basculer nginx en mode miroir (cf. nginx/entrypoint.sh).
      MIRROR_API_URL: ${MIRROR_API_URL:?URL de l API principale requise}
      MIRROR_RESOLVER: ${ManuIRROR_RESOLVER:-127.0.0.11}
      # Traefik est DEVANT, et le conteneur n'est joignable QUE par lui : faire
      # confiance à tout le RFC1918 est donc sûr ici, contrairement au miroir
      # exposé en direct sur un intranet, où les visiteurs sont eux-mêmes en IP
      # privée et pourraient forger leur adresse. Plusieurs plages parce que le
      # sous-réseau du réseau `coolify` n'est pas connu d'avance : se tromper
      # ferait valoir l'adresse de Traefik pour tout le monde, et l'instance
      # principale compterait tous les visiteurs du miroir comme un seul.
      MIRROR_TRUSTED_PROXY: ${MIRROR_TRUSTED_PROXY:-172.16.0.0/12 10.0.0.0/8 192.168.0.0/16}

    # `expose` et NON `ports` — la règle maison, et la raison du 504 : un port
    # publié court-circuite le proxy (ni TLS ni domaine), désactive les rolling
    # updates, et entre en collision avec les autres piles du même hôte, qui
    # tiennent déjà 127.0.0.1:3000.
    expose:
      - "80"

    # Sans ce label, Traefik peut tenter de joindre le conteneur par un réseau
    # auquel il n'a pas accès → Gateway Timeout. Coolify génère lui-même les
    # routers à partir du domaine réglé dans son interface ; on ne déclare que le
    # réseau cible.
    labels:
      - "traefik.docker.network=coolify"

    restart: unless-stopped
    healthcheck:
      # Interroge le miroir LUI-MÊME, pas la cible : un hoquet réseau de
      # l'instance principale ne doit pas faire redémarrer nginx en boucle.
      # En clair sur le port 80, TLS étant assuré par Traefik.
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - coolify

networks:
  coolify:
    external: true
