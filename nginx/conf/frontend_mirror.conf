# ===========================================================================
# MIROIR AUTONOME — nginx seul, sans backend ni base de données.
#
# Cette instance sert le frontend et relaie l'API vers l'instance principale.
# Aucun conteneur `backend` ni `mariadb` ne tourne ici : c'est nginx qui fait le
# relais, là où le « miroir applicatif » (réglé depuis le panneau) le fait dans
# Fastify. Voir docs/instance-miroir.md.
#
# `${MIRROR_API_ORIGIN}` et `${MIRROR_API_PATH}` sont posés par entrypoint.sh à
# partir de MIRROR_API_URL, après avoir vérifié que la cible répond.
# ===========================================================================

# Masquage du jeton dans les journaux — identique à la production : le retour de
# connexion 42 arrive en « /callback?token=<JWT> » et finirait en clair sur disque.
map $request_uri $gcc_safe_uri {
    ~^(?<gcc_uri_path>[^?]*)\?.*\btoken=   "$gcc_uri_path?token=[MASQUE]";
    default                                 $request_uri;
}

map $http_referer $gcc_safe_referer {
    ~^(?<gcc_ref_base>[^?]*)\?.*\btoken=   "$gcc_ref_base?token=[MASQUE]";
    default                                  $http_referer;
}

log_format gcc_masked '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $gcc_safe_uri $server_protocol" '
                      '$status $body_bytes_sent "$gcc_safe_referer" "$http_user_agent"';

server {
    listen 80 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/certificates/server.crt;
    ssl_certificate_key /etc/nginx/ssl/certificates/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Vraie IP client, quand un reverse proxy est placé DEVANT ce miroir.
    #
    # Restauré uniquement depuis `${MIRROR_TRUSTED_PROXY}`, et par défaut depuis
    # une adresse impossible (127.0.0.1/32 seul ne peut pas être un proxy tiers) :
    # autrement dit, désactivé sauf déclaration explicite.
    #
    # En production, le même bloc fait confiance à tout le RFC1918 parce que
    # Traefik y vit et qu'il réécrit X-Forwarded-For. Ce miroir, lui, publie son
    # port en direct et vise un intranet d'école : les clients y sont EUX-MÊMES en
    # IP privée. Faire confiance à 10/8 laissait donc n'importe quel visiteur
    # choisir l'IP inscrite dans les journaux et transmise à l'instance
    # principale — traçabilité perdue, et clé de rate-limit forgeable.
    set_real_ip_from ${MIRROR_TRUSTED_PROXY};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Résolveur DNS : nginx résout les noms des `proxy_pass` au DÉMARRAGE quand
    # l'hôte est écrit en dur. La cible étant externe et son IP susceptible de
    # changer, on passe par une variable — ce qui impose un résolveur explicite.
    resolver ${MIRROR_RESOLVER} valid=30s ipv6=off;
    resolver_timeout 5s;

    # --- Connexion 42 : on REDIRIGE le navigateur, on ne relaie pas -----------
    # L'instance principale détient les credentials 42 et son URL est la seule
    # déclarée côté intra. Le frontend a déjà mis `?origin=<ce miroir>` dans la
    # query : elle est transmise telle quelle, et c'est elle qui nous ramènera
    # l'utilisateur ici à la fin du parcours.
    location = /api/auth/42 {
        return 302 ${MIRROR_API_ORIGIN}${MIRROR_API_PATH}/auth/42$is_args$args;
    }

    # --- Ouverture de session OWNER : fermée sur un miroir --------------------
    # L'owner s'authentifie par le token console, affiché dans les logs du
    # serveur — celui de l'instance principale, pas d'ici. Laisser passer cette
    # route ferait transiter par le miroir le jeton qui donne TOUS les droits,
    # sans que cela serve à quoi que ce soit. Les délégués, eux, entrent avec
    # leur session 42 : le reste de /admin est relayé normalement.
    # `~*` et non `=` : le match EXACT était contournable. nginx décode l'URI avant
    # de choisir le bloc, si bien que `…/console%0a`, `…/console%20` ou
    # `…/console%3Fx=1` ne sont plus égaux à la chaîne attendue — ils tombaient donc
    # dans le relais générique, qui ré-émettait un chemin propre vers l'instance
    # principale. Le token owner y transitait, exactement ce qu'on veut empêcher.
    # Un préfixe insensible à la casse attrape toutes ces variantes, y compris le
    # slash final et les différences de casse.
    location ~* ^/api/admin/session/console {
        default_type application/json;
        return 403 '{"error":"L\'administration owner se fait sur l\'instance principale."}';
    }

    # --- Tout le reste de l'API part au relais --------------------------------
    # Capture regex et NON préfixe : avec une variable dans `proxy_pass`, nginx ne
    # retire pas le `/api/` de lui-même — il faut reconstruire le chemin cible.
    location ~ ^/api/(?<gcc_api_path>.*)$ {
        set $mirror_upstream ${MIRROR_API_ORIGIN};
        proxy_pass $mirror_upstream${MIRROR_API_PATH}/$gcc_api_path$is_args$args;

        # `Host` doit être celui de la CIBLE, sinon son routage et sa liste
        # d'origines ne s'y retrouvent pas.
        proxy_set_header Host ${MIRROR_API_HOST};
        proxy_ssl_server_name on;
        # SNI sans le port, que `Host` porte mais que TLS refuse.
        proxy_ssl_name ${MIRROR_API_SNI};

        # L'identité réelle du visiteur, pour le rate-limit de la principale.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Ssl on;

        # Les redirections ne sont pas suivies ici : le flux de connexion 42 en
        # dépend, c'est au navigateur de les suivre.
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;

        # Si l'instance principale est injoignable, on sert une page qui
        # l'explique plutôt qu'un 502 nu de nginx.
        proxy_intercept_errors on;
        # 502 et 504 UNIQUEMENT : ce sont les pannes de transport, celles où
        # l'instance principale ne répond pas. Le 503, lui, peut venir de
        # l'APPLICATION distante — « instance non configurée », par exemple — et
        # l'intercepter remplaçait une réponse métier parfaitement valide par
        # « le serveur ne répond pas ». Le frontend du miroir ne pouvait alors plus
        # distinguer « principale à configurer » de « principale morte ».
        #
        # `=503` et non `=` seul : sans code explicite, nginx renvoie celui du
        # named location — 200, puisque le fichier existe. Un monitoring croirait
        # alors le service en bonne santé.
        error_page 502 504 =503 @api_indisponible;
    }

    # Page d'attente : l'API ne répond pas. Le visiteur n'y peut rien, on le dit.
    location @api_indisponible {
        root /usr/share/nginx/html;
        try_files /api-indisponible.html =503;
        add_header Cache-Control "no-store" always;
        default_type text/html;
    }

    # Santé du miroir lui-même : nginx répond seul, sans dépendre de la cible.
    # Un healthcheck qui interrogerait la principale ferait redémarrer le miroir
    # à chaque hoquet réseau de celle-ci.
    location = /api/health {
        default_type application/json;
        return 200 '{"status":"ok","mode":"mirror"}';
    }

    # --- Frontend statique ----------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # Jamais depuis le cache : c'est lui qui porte le nom hashé du bundle.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    error_log /var/log/nginx/simulator_error.log;
    access_log /var/log/nginx/simulator_access.log gcc_masked;
}
