server {
    listen 80;
    server_name localhost;

    # --- Vraie IP client derrière le Traefik de Coolify ---
    # Sans ceci, $remote_addr vaut l'IP de TRAEFIK pour 100 % des visiteurs : le
    # X-Real-IP transmis au backend devient une constante, et la clé de rate-limit
    # est partagée par tout Internet → n'importe quel anonyme peut verrouiller le
    # login admin (console + passkey). On restaure la vraie IP depuis X-Forwarded-For
    # en ne faisant confiance qu'aux réseaux privés (Traefik y vit) ; `recursive on`
    # remonte jusqu'au premier hop non approuvé, donc un XFF forgé par le client est
    # ignoré. En dev (pas de proxy amont), ce bloc est sans effet.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Proxy des requêtes API vers le backend (général)
    # Note: pas de / à la fin de proxy_pass pour garder le préfixe /api/
    location /api/ {
        proxy_pass http://app-backend:7000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Proxy vers phpMyAdmin
    location /phpmyadmin/ {
        proxy_pass http://phpmyadmin:80/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Headers spécifiques pour phpMyAdmin
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Serve le frontend React (fichiers statiques buildés)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        
        # Cache pour les assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    error_log /var/log/nginx/simulator_error.log;
    access_log /var/log/nginx/simulator_access.log;
}
